server:
  port: -1

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: BarterTechUltraSecureKeyForJWTGenerationMinimum256BitsLong2026TestEnv!
    expiration-hours: 2
